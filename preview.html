<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PWP</title>
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="styles.css?<?=time()?>">
	<style type="text/css">
		@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Quicksand&display=swap');

		:root {
			--heading-color: #fff;
			--transp-blck: rgba(0, 0, 0, 0.5);
		}

		body {
			font-family: 'Quicksand', sans-serif;
			margin: 0;
			padding-bottom: 10rem;
		}

		header {
			background-image: url("https://picsum.photos/1280/800");
			padding-bottom: 5rem;
			background-size: cover;
		}

		header:after {
			content: '';
			background-color: rgba(0, 0, 0, 0.5);
			position: absolute;
			top: 0;
			left: 0;
			z-index: 2;
		}

		.intro {
			margin: auto;
			text-align: center;
			align-items: center;
			padding-top: 5rem;
			padding: 5rem;
		}

		.intro h1, .intro h2, .intro h3 {
			font-family: 'Playfair Display', serif;
			color: var(--heading-color);
			font-size: calc(1em + 8vw);
		}

		.intro p {
			margin-top: -4rem;
			color: var(--heading-color);
			font-size: calc(1em + 2vw);
		}

		nav {
			padding: 1rem;
			background-color: var(--transp-blck);
			backdrop-filter: blur(5px);
			-webkit-backdrop-filter: blur(5px);
		}

		nav a {
			padding: 0.5rem;
			color: var(--heading-color);
			text-decoration: none;
			font-size: calc(1em + 0.2vw);
		}

		nav a:hover {
			text-decoration: underline;
		}

		.features {
			font-size: calc(1em + 1vw);
			width: 100%;
		}

		.features div {
			padding: 0rem 0rem;
			display: flex;
		}

		.features .second {
			margin-left: -2rem;
		}

		.features .first,
		.features .third {
			margin-right: 0rem;
		}

		.features .text {
			padding: 0 0.5rem;
			width: 100%;
		}

		.features .image {
			width: calc(100vw + 6rem);
			display: block;
		}

		.sticky {
			position: fixed;
			top: 0;
			width: 100%;
		}

		hr {
			width: 25%;
			text-align: center;
			border-color: midnightblue;
		}

		img {
			display: block;
			width: 100%;
		}

		::selection {
			background-color: rgba(0, 0, 0, 0.7);
			color: white;
		}

		::-moz-selection {
			background-color: rgba(0, 0, 0, 0.7);
			color: white;
		}

		@media (max-width: 60em) {
			.intro p {
				margin-top: -2rem;
			}

			.intro {
				padding: 3rem;
			}
		}

		/*@media (max-width: 32em) {
			.features div {
				display: block;
			}
		}*/

		@media (max-width: 30em) {
			.intro p {
				margin-top: -1rem;
			}

			.intro {
				padding: 2rem;
			}
		}

		@media (max-width: 25em) {
			.intro {
				padding: 1rem;
			}
		}
	</style>
</head>
<body>
	<header>
		<nav id="navbar">
			<a href="#">Home</a>
			<a href="#">About</a>
			<a href="#">Contact</a>
		</nav>
		<div class="intro">
			<h1 id="heading">SATech</h1>
			<p>We repair Laptops, Tablets, Desktops and more.</p>
		</div>
	</header>
	<section class="features">
		<div class="first">
			<div class="text">
				<h3>We handle your devices with care</h3>
			</div>
			<div class="image">
				<img src="https://picsum.photos/1280/800" />
			</div>
		</div>
		<!-- <hr> -->
		<div class="second">
			<div class="image">
				<img src="https://picsum.photos/1280/800">
			</div>
			<div class="text">
				<h3>Guaranteed satisfaction on repair</h3>
			</div>
		</div>
		<!-- <hr> -->
		<div class="third">
			<div class="text">
				<h3>We handle your devices with care</h3>
			</div>
			<div class="image">
				<img src="https://picsum.photos/1280/800" />
			</div>
		</div>
	</section>
</body>
<script>
	const navbar = document.getElementById("navbar");
	const sticky = navbar.offsetTop;

	const stickyNavbar = () => {
		if (window.pageYOffset >= sticky) {
			navbar.classList.add("sticky")
		}
		else {
			navbar.classList.remove("sticky");
		}
	}

	window.onscroll = () => {
		stickyNavbar();
	}
</script>
</html>
